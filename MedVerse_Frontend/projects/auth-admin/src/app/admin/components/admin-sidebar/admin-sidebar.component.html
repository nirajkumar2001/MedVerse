 
<aside class="sidebar">

  <div>
    <div class="brand">
      <div class="shield"><img src="shared-assets\Medverse_images\logo_medverse.png" alt="Logo"></div>
      <!-- <div>
        <h2>Admin Panel</h2>
        <p>User Approval</p>

      </div> -->
    </div>

    <nav class="nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/admin/profiles" routerLinkActive="active">
        <span class="nav-icon">👥</span>
        <span>Users</span>
      </a>

      <a routerLink="/admin/approved-users" routerLinkActive="active">
        <span class="nav-icon">☑</span>
        <span>Approved Users</span>
        <b class="green-badge">{{ isLoadingCounts ? '...' : approvedCount }}</b>
      </a>

      <a routerLink="/admin/rejected-users" routerLinkActive="active">
        <span class="nav-icon">⊗</span>
        <span>Rejected Users</span>
        <b class="red-badge">{{ isLoadingCounts ? '...' : rejectedCount }}</b>
      </a>

      <a routerLink="/admin/alerts" routerLinkActive="active">
        <span class="nav-icon">▥</span>
        <span>Activity Log</span>
      </a>

      <!-- <a>
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
      </a> -->
    </nav>
  </div>

  <div>
    <div class="admin-box">
      <span class="admin-photo"></span>

      <!-- <div>
        <h4>Admin</h4>
        <p>Super Administrator</p>
      </div> -->
    </div>

    <button class="logout" type="button" (click)="openLogoutModal()">Logout</button>
  </div>
  
</aside>

<lib-logout-confirm-modal
  [open]="showLogoutModal"
  (cancelled)="closeLogoutModal()"
  (confirmed)="confirmLogout()">
</lib-logout-confirm-modal>
