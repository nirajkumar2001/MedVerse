<div class="notif-item" [class.read]="!notification.unread" [class.active-session]="isActiveSession"
  [class.new-request]="isNewRequest" [class.dismissed-session]="isDismissed" [class.completed-session]="isCompleted"
  [ngClass]="'notif-' + notification.type">

  <div class="unread-dot" *ngIf="notification.unread"></div>

  <div class="notif-icon">
    {{ icon }}
  </div>

  <div class="notif-body-wrap">
    <div class="notif-title">
      {{ notification.title }}
    </div>

    <div class="notif-body">
      {{ notification.message }}
    </div>

    <div class="access-scope" *ngIf="notification.accessScope">
      Access Scope:
      <strong>{{ notification.accessScope }}</strong>
    </div>

    <div class="notif-time-grid">
      <div class="notif-time-chip"
        *ngIf="notification.displayNotificationTime && notification.displayNotificationTime !== 'Not available'">
        <span>Notification Received</span>
        <strong>{{ notification.displayNotificationTime }}</strong>
      </div>

      <div class="notif-time-chip success"
        *ngIf="notification.displayGrantedTime && notification.displayGrantedTime !== 'Not available'">
        <span>Access Granted</span>
        <strong>{{ notification.displayGrantedTime }}</strong>
      </div>

      <div class="notif-time-chip completed"
        *ngIf="notification.displayCompletedTime && notification.displayCompletedTime !== 'Not available'">
        <span>Session Closed</span>
        <strong>{{ notification.displayCompletedTime }}</strong>
      </div>
    </div>

    <div class="notif-actions">
      <button class="btn-view-profile" type="button" *ngIf="showViewProfileAction"
        (click)="actionClicked.emit(notification)">
        View Patient Profile
      </button>

      <button class="btn-end-session" type="button" *ngIf="showEndSessionAction"
        (click)="endSessionClicked.emit(notification)">
        End Session
      </button>

      <button class="btn-dismiss" type="button" *ngIf="showDismiss && !showEndSessionAction"
        (click)="dismissed.emit(notification.id)">
        Dismiss
      </button>
    </div>
  </div>

  <app-access-status-chip *ngIf="showStatusChip" [type]="notification.type" [label]="statusLabel">
  </app-access-status-chip>
</div>
