<div class="modal-overlay" *ngIf="open">
  <div class="modal-box">
    <div class="modal-icon" [ngClass]="iconType">
      {{ icon }}
    </div>

    <h2>{{ title }}</h2>
    <p>{{ message }}</p>

    <div class="modal-actions">
      <button class="btn-modal-cancel" type="button" (click)="cancelled.emit()">
        {{ cancelText }}
      </button>

      <button
        class="btn-modal-confirm"
        [class.danger]="confirmType === 'danger'"
        type="button"
        (click)="confirmed.emit()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
