
<div class="dashboard-container">
  <div class="card" 
  *ngFor="let item of stats"
  >
    
    <div class="left-section">
      <div class="icon" [ngClass]="item.bgColor">
      <!-- <div class="icon" > -->
        <img [src]="item.icon" alt="icon" />
      </div>

      <div class="content">
        <h4>{{ item.title }}</h4>
        <h2>{{ item.count }}</h2>
        <p>{{ item.subtitle }}</p>
      </div>
    </div>

    <div class="arrow">
      →
    </div>

  </div>
</div>
