# =================================================
# Application & Server
# =================================================
spring.application.name=MedVerse
server.port=9090

# =================================================
# PostgreSQL Database Configuration
# =================================================
# Configure POSTGRES_URL, POSTGRES_USER, and POSTGRES_PASSWORD locally.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/medverse}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =================================================
# JPA / Hibernate Configuration
# =================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Default Schema
spring.jpa.properties.hibernate.default_schema=prod

# =================================================
# HikariCP Connection Pool (Production Ready)
# =================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =================================================
# Redis Infrastructure
# =================================================
medverse.redis.enabled=${MEDVERSE_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# =================================================
# Kafka Infrastructure
# =================================================
medverse.kafka.enabled=${MEDVERSE_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:medverse-backend}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =================================================
# JWT Configuration
# =================================================
security.jwt.secret=${JWT_SECRET:local-development-secret-change-me}

# =================================================
# Logging Configuration (Helpful for Development)
# =================================================
logging.level.root=INFO
logging.level.com.medverse=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.security=DEBUG

# =================================================
# Email Configuration
# =================================================
# Development default: print OTPs in the backend console.
email.provider=log

# Later, to send OTPs to the user's email, switch the provider to smtp and
# configure a real mailbox/app password. Keep these commented until ready:
# email.provider=smtp
email.from=${spring.mail.username}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =================================================
# Spring Security Default User (Development Only)
# =================================================
spring.security.user.name=admin@medverse.com
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:change-me-locally}

# Default application admin login
medverse.default-admin.enabled=true
medverse.default-admin.user-id=ADM00001
medverse.default-admin.name=MedVerse Admin
medverse.default-admin.email=admin@medverse.com
medverse.default-admin.password=${MEDVERSE_ADMIN_PASSWORD:change-me-locally}

# =================================================
# Other Configurations
# =================================================
# File Upload Size (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator & Monitoring (Optional)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
