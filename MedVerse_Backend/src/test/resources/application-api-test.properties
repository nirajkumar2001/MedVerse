spring.datasource.url=jdbc:h2:mem:medverse_api_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS dev
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.format-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=dev

email.provider=log
security.jwt.secret=test-only-jwt-secret-change-me-0123456789abcdef
medverse.default-admin.enabled=false
medverse.redis.enabled=false
medverse.kafka.enabled=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
